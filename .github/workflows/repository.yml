name: Repository checks
on:
  push:
    branches: [main, 'task/**', 'setup/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repo-contracts:
    name: repo-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact change
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate repository contracts and public files
        run: python Tools/Validation/check_repository.py
      - name: Check include boundaries between FiskGame areas
        run: python Tools/Validation/check_includes.py
      - name: Test validation failure cases
        run: python -m unittest discover -s Tools/Validation -p 'test_*.py' -v
      - name: Test change-based test selection
        run: python -m unittest discover -s Tools/Testing -p 'test_*.py' -v
      - name: Test fail-closed Broen review handshake
        run: python -m unittest discover -s Tools/Coordination -p 'test_*.py' -v

      - name: Validate Unreal foundation structure
        run: python Tools/Validation/check_bootstrap.py
