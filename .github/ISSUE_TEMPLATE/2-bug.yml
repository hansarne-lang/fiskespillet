{
  "name": "Feilrapport",
  "description": "Reproduserbar feil med versjon, forventet resultat og testkrav.",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "GitHub gir oppgaven unik issue-ID. Oppgaven starter i Backlog. Dette skjemaet tildeler ingen agent og gir ingen godkjenning. Koordinatoren må kontrollere felter, avhengigheter, godkjenning og filreservasjon før Ready/In Progress."
      }
    },
    {
      "type": "input",
      "id": "build",
      "attributes": {
        "label": "Versjon og build-ID",
        "description": "Oppgi klient/server-versjoner ved LAN-feil. Bruk Ikke relevant for dokumentfeil."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reproduction",
      "attributes": {
        "label": "Slik gjentas feilen"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected_actual",
      "attributes": {
        "label": "Forventet og faktisk resultat"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "responsible",
      "attributes": {
        "label": "Foreslått ansvarlig",
        "description": "GitHub-brukernavn eller Uavklart. Faktisk ansvarlig settes som issue-assignee før Ready."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "priority_request",
      "attributes": {
        "label": "Foreslått prioritet",
        "description": "Inntaksforslag. Etter triage er Project-feltet Priority autoritativt.",
        "options": [
          "P0 Kritisk",
          "P1 Høy",
          "P2 Normal",
          "P3 Lav"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "module_request",
      "attributes": {
        "label": "Modul",
        "description": "Inntaksforslag. Etter triage er Project-feltet Module autoritativt.",
        "options": [
          "FiskCore",
          "Fishing",
          "Boats",
          "World",
          "DayCycle",
          "Economy",
          "Career",
          "Multiplayer",
          "UI",
          "Platform",
          "CrossModule"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "dependencies",
      "attributes": {
        "label": "Avhengigheter",
        "description": "Oppgi issue-URL-er eller Ingen. Bekreft avhengighetene som GitHub Blocked by-relasjoner før Ready."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "allowed_files",
      "attributes": {
        "label": "AllowedFiles",
        "description": "Tillatte repository-relative stier/glober. Skriv Uavklart ved behov; oppgaven kan da ikke bli Ready."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "acceptance",
      "attributes": {
        "label": "Akseptansekriterier",
        "description": "Observerbare vilkår for at oppgaven er fullført."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "tests",
      "attributes": {
        "label": "Testkrav",
        "description": "Relevante tester og forventede bevis. Planlagt test er ikke et bestått resultat."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "evidence",
      "attributes": {
        "label": "Bevis og påvirkning",
        "description": "Saniterte logger, skjermbilder, hyppighet og eventuell datatap. Ikke legg inn nøkler eller personlige logger."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
